name: release

# Build and publish the `inscien` wheel to PyPI on a `v*` tag (or manually).
#
# The wheel is pure Python with the built UI vendored in, so this one Linux build serves Windows,
# macOS and Linux. Node is needed here, to build the UI, and never by an installed copy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC) - no stored token
    steps:
      - uses: actions/checkout@v4

      - name: Guard - tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^__version__' src/inscien/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$tag  package=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $ver. Bump src/inscien/__init__.py first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm", cache-dependency-path: frontend/package-lock.json }

      # The static UI, vendored into the package so the wheel serves it (same as `make web`).
      - name: Build the UI into src/inscien/webui
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../src/inscien/webui
          cp -r out ../src/inscien/webui

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      # Trusted publishing: uv picks up the GitHub Actions OIDC token (id-token: write above).
      # PyPI lists this repo and this workflow file (release.yml) as a trusted publisher for `inscien`.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
