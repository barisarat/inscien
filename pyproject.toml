[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inscien"
dynamic = ["version"]
description = "A local map of your Zotero papers and what they cite, read off their own PDFs, and narrations to listen to."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "SQLAlchemy>=2.0",
    "pydantic>=2.7",
    "requests>=2.31",
    "platformdirs>=4",
    "pymupdf>=1.24,<2",
    "regex>=2024.0",
    "numpy>=1.26",
    "kokoro-onnx>=0.4",
    "onnxruntime>=1.19",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/barisarat/inscien"
Source = "https://github.com/barisarat/inscien"
Issues = "https://github.com/barisarat/inscien/issues"

[project.scripts]
inscien = "inscien.cli:main"

[tool.hatch.version]
path = "src/inscien/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inscien"]
# The built UI is gitignored (make web regenerates it) but must ship in the wheel.
artifacts = ["src/inscien/webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# Only what rebuilds the wheel: without this the sdist takes the whole checkout, CI build output included.
include = ["src/inscien", "tests", "README.md", "LICENSE"]
artifacts = ["src/inscien/webui"]
